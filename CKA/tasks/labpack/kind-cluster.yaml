# kind multi-node cluster for the API-lab task pack.
#   kind create cluster --config kind-cluster.yaml
# One control plane + two workers gives realistic scheduling, affinity, and NodePort behavior.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cka
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
