<rect class="gate" height="64" rx="14" width="380" x="40" y="20" fill="#e5edff" stroke="#9bb4ee" stroke-width="2"></rect><text class="label" x="64" y="48" fill="#111827" font-size="20" font-weight="800">All nodes Ready?</text><text class="tiny" x="64" y="70" fill="#64748b" font-size="16" font-weight="700">kubectl get nodes</text>
<rect class="repel" height="64" rx="14" width="500" x="580" y="20" fill="#fef0d4" stroke="#eeb85b" stroke-width="2"></rect><text class="tiny" x="600" y="48" fill="#64748b" font-size="16" font-weight="700">NODE: journalctl -u kubelet · crictl · /etc/cni/net.d · certs</text><text class="tiny" x="600" y="70" fill="#64748b" font-size="16" font-weight="700">DiskPressure / Ready=Unknown clues live here</text>
<rect class="gate" height="64" rx="14" width="380" x="40" y="130" fill="#e5edff" stroke="#9bb4ee" stroke-width="2"></rect><text class="label" x="64" y="158" fill="#111827" font-size="20" font-weight="800">Pod Running &amp; Ready?</text><text class="tiny" x="64" y="180" fill="#64748b" font-size="16" font-weight="700">kubectl describe pod · events</text>
<rect class="repel" height="64" rx="14" width="500" x="580" y="130" fill="#fef0d4" stroke="#eeb85b" stroke-width="2"></rect><text class="tiny" x="600" y="158" fill="#64748b" font-size="16" font-weight="700">WORKLOAD: image pull · probes · config · requests/limits</text><text class="tiny" x="600" y="180" fill="#64748b" font-size="16" font-weight="700">CrashLoopBackOff → kubectl logs -p</text>
<rect class="gate" height="64" rx="14" width="380" x="40" y="240" fill="#e5edff" stroke="#9bb4ee" stroke-width="2"></rect><text class="label" x="64" y="268" fill="#111827" font-size="20" font-weight="800">Service has endpoints?</text><text class="tiny" x="64" y="290" fill="#64748b" font-size="16" font-weight="700">kubectl get endpointslices</text>
