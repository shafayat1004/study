<svg xmlns="http://www.w3.org/2000/svg" aria-label="Troubleshooting decision tree from symptom to layer" class="diagram" role="img" viewBox="0 0 1120 510">
<defs>
<marker id="arrowTrOk" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="arrow" d="M0,0 L0,6 L9,3 z" fill="#64748b"></path></marker>
<marker id="arrowTrNo" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="bad-arrow" d="M0,0 L0,6 L9,3 z" fill="#f59e0b"></path></marker>
