<rect class="gate" height="64" rx="14" width="380" x="40" y="350" fill="#e5edff" stroke="#9bb4ee" stroke-width="2"></rect><text class="label" x="64" y="378" fill="#111827" font-size="20" font-weight="800">Name resolves?</text><text class="tiny" x="64" y="400" fill="#64748b" font-size="16" font-weight="700">nslookup svc.ns.svc.cluster.local</text>
