<svg xmlns="http://www.w3.org/2000/svg" aria-label="NetworkPolicy OR versus AND selector behaviour" class="diagram" role="img" viewBox="0 0 1120 360">
<style><![CDATA[
.box { fill: color-mix(in srgb, var(--accent, #326ce5) 7%, transparent); stroke: var(--line, #d9e2ef); stroke-width: 2; }
.worker { fill: color-mix(in srgb, var(--accent-2, #14b8a6) 7%, transparent); }
.node { fill: var(--paper-solid, #ffffff); stroke: color-mix(in srgb, var(--accent, #326ce5) 45%, var(--line, #d9e2ef)); stroke-width: 2; }
.api { fill: color-mix(in srgb, var(--accent, #326ce5) 16%, var(--paper-solid, #ffffff)); }
.etcd { fill: color-mix(in srgb, var(--warn, #f59e0b) 18%, var(--paper-solid, #ffffff)); }
.pod { fill: color-mix(in srgb, var(--good, #22c55e) 16%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--good, #22c55e) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.line { fill: none; stroke: var(--muted, #64748b); stroke-width: 3; }
.dashed { stroke-dasharray: 8 8; }
.arrow { fill: var(--muted, #64748b); }
.title { fill: var(--ink, #111827); font-size: 28px; font-weight: 900; }
.label { fill: var(--ink, #111827); font-size: 20px; font-weight: 800; }
.tiny { fill: var(--muted, #64748b); font-size: 16px; font-weight: 700; }
.attract { fill: color-mix(in srgb, var(--good, #22c55e) 16%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--good, #22c55e) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.repel { fill: color-mix(in srgb, var(--warn, #f59e0b) 18%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--warn, #f59e0b) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.ctrl { fill: color-mix(in srgb, var(--accent-3, #8b5cf6) 15%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--accent-3, #8b5cf6) 50%, var(--line, #d9e2ef)); stroke-width: 2; }
.ok-line { fill: none; stroke: var(--good, #22c55e); stroke-width: 3; }
.bad-line { fill: none; stroke: var(--warn, #f59e0b); stroke-width: 3; }
.ok-arrow { fill: var(--good, #22c55e); }
.bad-arrow { fill: var(--warn, #f59e0b); }
.gate { fill: color-mix(in srgb, var(--accent, #326ce5) 12%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--accent, #326ce5) 45%, var(--line, #d9e2ef)); stroke-width: 2; }
.divider { stroke: var(--line, #d9e2ef); stroke-width: 2; }
]]></style>
<defs>
<marker id="arrowNpOk" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="ok-arrow" d="M0,0 L0,6 L9,3 z"></path></marker>
<marker id="arrowNpBad" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="bad-arrow" d="M0,0 L0,6 L9,3 z"></path></marker>
</defs>
<text class="title" x="20" y="40">Separate "-" items = OR</text>
<rect class="node" height="54" rx="12" width="220" x="20" y="64"></rect><text class="tiny" x="40" y="88">namespaceSelector</text><text class="tiny" x="40" y="108">team: payments</text>
<rect class="node" height="54" rx="12" width="220" x="20" y="140"></rect><text class="tiny" x="40" y="164">podSelector</text><text class="tiny" x="40" y="184">app: api</text>
<rect class="attract" height="80" rx="16" width="170" x="330" y="92"></rect><text class="label" x="356" y="130">backend</text><text class="tiny" x="356" y="152">target Pod</text>
<path class="ok-line" d="M240 91 C290 100 300 120 330 128" marker-end="url(#arrowNpOk)"></path>
<path class="ok-line" d="M240 167 C290 158 300 142 330 134" marker-end="url(#arrowNpOk)"></path>
<text class="tiny" x="20" y="232">either source is allowed on its own</text>
<line class="divider" x1="560" x2="560" y1="30" y2="330"></line>
<text class="title" x="600" y="40">Same "-" item = AND</text>
<rect class="node" height="80" rx="12" width="250" x="600" y="64"></rect><text class="tiny" x="620" y="92">namespaceSelector: payments</text><text class="tiny" x="620" y="116">+ podSelector: app=api</text><text class="tiny" x="620" y="138">(both, together)</text>
<rect class="attract" height="80" rx="16" width="170" x="910" y="74"></rect><text class="label" x="936" y="112">backend</text>
<path class="ok-line" d="M850 104 C885 110 895 110 910 112" marker-end="url(#arrowNpOk)"></path>
<rect class="repel" height="50" rx="12" width="250" x="600" y="200"></rect><text class="tiny" x="620" y="230">right ns but wrong Pod label</text>
<path class="bad-line" d="M850 225 H905" marker-end="url(#arrowNpBad)"></path>
<text class="bad-arrow" font-size="26" font-weight="900" x="864" y="214">✕</text>
<text class="tiny" x="600" y="300">a source must satisfy both selectors at once</text>
</svg>
