<svg xmlns="http://www.w3.org/2000/svg" aria-label="NetworkPolicy OR versus AND selector behaviour" class="diagram" role="img" viewBox="0 0 1120 360">
<defs>
<marker id="arrowNpOk" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="ok-arrow" d="M0,0 L0,6 L9,3 z" fill="#22c55e"></path></marker>
<marker id="arrowNpBad" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="bad-arrow" d="M0,0 L0,6 L9,3 z" fill="#f59e0b"></path></marker>
</defs>
<text class="title" x="20" y="40" fill="#111827" font-size="28" font-weight="900">Separate "-" items = OR</text>
<rect class="node" height="54" rx="12" width="220" x="20" y="64" fill="#ffffff" stroke="#9bb4ee" stroke-width="2"></rect><text class="tiny" x="40" y="88" fill="#64748b" font-size="16" font-weight="700">namespaceSelector</text><text class="tiny" x="40" y="108" fill="#64748b" font-size="16" font-weight="700">team: payments</text>
<rect class="node" height="54" rx="12" width="220" x="20" y="140" fill="#ffffff" stroke="#9bb4ee" stroke-width="2"></rect><text class="tiny" x="40" y="164" fill="#64748b" font-size="16" font-weight="700">podSelector</text><text class="tiny" x="40" y="184" fill="#64748b" font-size="16" font-weight="700">app: api</text>
<rect class="attract" height="80" rx="16" width="170" x="330" y="92" fill="#dcfce7" stroke="#6edb8d" stroke-width="2"></rect><text class="label" x="356" y="130" fill="#111827" font-size="20" font-weight="800">backend</text><text class="tiny" x="356" y="152" fill="#64748b" font-size="16" font-weight="700">target Pod</text>
<path class="ok-line" d="M240 91 C290 100 300 120 330 128" marker-end="url(#arrowNpOk)" fill="none" stroke="#22c55e" stroke-width="3"></path>
<path class="ok-line" d="M240 167 C290 158 300 142 330 134" marker-end="url(#arrowNpOk)" fill="none" stroke="#22c55e" stroke-width="3"></path>
<text class="tiny" x="20" y="232" fill="#64748b" font-size="16" font-weight="700">either source is allowed on its own</text>
<line class="divider" x1="560" x2="560" y1="30" y2="330" stroke="#d9e2ef" stroke-width="2"></line>
<text class="title" x="600" y="40" fill="#111827" font-size="28" font-weight="900">Same "-" item = AND</text>
<rect class="node" height="80" rx="12" width="250" x="600" y="64" fill="#ffffff" stroke="#9bb4ee" stroke-width="2"></rect><text class="tiny" x="620" y="92" fill="#64748b" font-size="16" font-weight="700">namespaceSelector: payments</text><text class="tiny" x="620" y="116" fill="#64748b" font-size="16" font-weight="700">+ podSelector: app=api</text><text class="tiny" x="620" y="138" fill="#64748b" font-size="16" font-weight="700">(both, together)</text>
<rect class="attract" height="80" rx="16" width="170" x="910" y="74" fill="#dcfce7" stroke="#6edb8d" stroke-width="2"></rect><text class="label" x="936" y="112" fill="#111827" font-size="20" font-weight="800">backend</text>
<path class="ok-line" d="M850 104 C885 110 895 110 910 112" marker-end="url(#arrowNpOk)" fill="none" stroke="#22c55e" stroke-width="3"></path>
<rect class="repel" height="50" rx="12" width="250" x="600" y="200" fill="#fef0d4" stroke="#eeb85b" stroke-width="2"></rect><text class="tiny" x="620" y="230" fill="#64748b" font-size="16" font-weight="700">right ns but wrong Pod label</text>
<path class="bad-line" d="M850 225 H905" marker-end="url(#arrowNpBad)" fill="none" stroke="#f59e0b" stroke-width="3"></path>
<text class="bad-arrow" font-size="26" font-weight="900" x="864" y="214" fill="#f59e0b">✕</text>
<text class="tiny" x="600" y="300" fill="#64748b" font-size="16" font-weight="700">a source must satisfy both selectors at once</text>
</svg>
