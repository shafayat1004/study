<svg xmlns="http://www.w3.org/2000/svg" aria-label="PV PVC StorageClass binding and reclaim policy" class="diagram" role="img" viewBox="0 0 1120 360">
<style><![CDATA[
.box { fill: color-mix(in srgb, var(--accent, #326ce5) 7%, transparent); stroke: var(--line, #d9e2ef); stroke-width: 2; }
.worker { fill: color-mix(in srgb, var(--accent-2, #14b8a6) 7%, transparent); }
.node { fill: var(--paper-solid, #ffffff); stroke: color-mix(in srgb, var(--accent, #326ce5) 45%, var(--line, #d9e2ef)); stroke-width: 2; }
.api { fill: color-mix(in srgb, var(--accent, #326ce5) 16%, var(--paper-solid, #ffffff)); }
.etcd { fill: color-mix(in srgb, var(--warn, #f59e0b) 18%, var(--paper-solid, #ffffff)); }
.pod { fill: color-mix(in srgb, var(--good, #22c55e) 16%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--good, #22c55e) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.line { fill: none; stroke: var(--muted, #64748b); stroke-width: 3; }
.dashed { stroke-dasharray: 8 8; }
.arrow { fill: var(--muted, #64748b); }
.title { fill: var(--ink, #111827); font-size: 28px; font-weight: 900; }
.label { fill: var(--ink, #111827); font-size: 20px; font-weight: 800; }
.tiny { fill: var(--muted, #64748b); font-size: 16px; font-weight: 700; }
.attract { fill: color-mix(in srgb, var(--good, #22c55e) 16%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--good, #22c55e) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.repel { fill: color-mix(in srgb, var(--warn, #f59e0b) 18%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--warn, #f59e0b) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.ctrl { fill: color-mix(in srgb, var(--accent-3, #8b5cf6) 15%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--accent-3, #8b5cf6) 50%, var(--line, #d9e2ef)); stroke-width: 2; }
.ok-line { fill: none; stroke: var(--good, #22c55e); stroke-width: 3; }
.bad-line { fill: none; stroke: var(--warn, #f59e0b); stroke-width: 3; }
.ok-arrow { fill: var(--good, #22c55e); }
.bad-arrow { fill: var(--warn, #f59e0b); }
.gate { fill: color-mix(in srgb, var(--accent, #326ce5) 12%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--accent, #326ce5) 45%, var(--line, #d9e2ef)); stroke-width: 2; }
.divider { stroke: var(--line, #d9e2ef); stroke-width: 2; }
]]></style>
<defs><marker id="arrowPv" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="arrow" d="M0,0 L0,6 L9,3 z"></path></marker></defs>
<rect class="ctrl" height="70" rx="16" width="200" x="20" y="40"></rect><text class="label" x="46" y="76">StorageClass</text><text class="tiny" x="46" y="98">provisioner + params</text>
<rect class="node" height="70" rx="16" width="160" x="300" y="40"></rect><text class="label" x="338" y="80">PV</text>
<rect class="node" height="70" rx="16" width="160" x="540" y="40"></rect><text class="label" x="572" y="80">PVC</text>
<rect class="pod" height="70" rx="16" width="160" x="780" y="40"></rect><text class="label" x="826" y="80">Pod</text>
<path class="line" d="M220 75 H300" marker-end="url(#arrowPv)"></path><text class="tiny" x="222" y="34">dynamic provision</text>
<path class="ok-line" d="M460 75 H540" marker-end="url(#arrowPv)"></path><text class="tiny" x="468" y="34">bound</text>
<path class="line" d="M700 75 H780" marker-end="url(#arrowPv)"></path><text class="tiny" x="706" y="34">mounts</text>
<text class="title" x="20" y="190">When the PVC is deleted…</text>
<rect class="repel" height="70" rx="16" width="200" x="20" y="210"></rect><text class="tiny" x="40" y="240">PVC deleted</text><text class="tiny" x="40" y="262">PV → Released</text>
<rect class="attract" height="70" rx="16" width="260" x="320" y="180"></rect><text class="label" x="346" y="216">Retain</text><text class="tiny" x="346" y="240">PV + data kept for manual recovery</text>
<rect class="repel" height="70" rx="16" width="260" x="320" y="270"></rect><text class="label" x="346" y="306">Delete</text><text class="tiny" x="346" y="330">PV and backing volume destroyed</text>
<path class="ok-line" d="M220 235 C270 220 280 215 320 213" marker-end="url(#arrowPv)"></path>
<path class="bad-line" d="M220 250 C270 270 280 290 320 300" marker-end="url(#arrowPv)"></path>
<text class="tiny" x="640" y="220">choose Retain for valuable data;</text>
<text class="tiny" x="640" y="244">dynamic volumes often default to Delete</text>
</svg>
