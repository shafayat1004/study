<svg xmlns="http://www.w3.org/2000/svg" aria-label="PV PVC StorageClass binding and reclaim policy" class="diagram" role="img" viewBox="0 0 1120 360">
<defs><marker id="arrowPv" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="arrow" d="M0,0 L0,6 L9,3 z" fill="#64748b"></path></marker></defs>
<rect class="ctrl" height="70" rx="16" width="200" x="20" y="40" fill="#ede9fe" stroke="#b69bf2" stroke-width="2"></rect><text class="label" x="46" y="76" fill="#111827" font-size="20" font-weight="800">StorageClass</text><text class="tiny" x="46" y="98" fill="#64748b" font-size="16" font-weight="700">provisioner + params</text>
<rect class="node" height="70" rx="16" width="160" x="300" y="40" fill="#ffffff" stroke="#9bb4ee" stroke-width="2"></rect><text class="label" x="338" y="80" fill="#111827" font-size="20" font-weight="800">PV</text>
<rect class="node" height="70" rx="16" width="160" x="540" y="40" fill="#ffffff" stroke="#9bb4ee" stroke-width="2"></rect><text class="label" x="572" y="80" fill="#111827" font-size="20" font-weight="800">PVC</text>
<rect class="pod" height="70" rx="16" width="160" x="780" y="40" fill="#dcfce7" stroke="#6edb8d" stroke-width="2"></rect><text class="label" x="826" y="80" fill="#111827" font-size="20" font-weight="800">Pod</text>
<path class="line" d="M220 75 H300" marker-end="url(#arrowPv)" fill="none" stroke="#64748b" stroke-width="3"></path><text class="tiny" x="222" y="34" fill="#64748b" font-size="16" font-weight="700">dynamic provision</text>
<path class="ok-line" d="M460 75 H540" marker-end="url(#arrowPv)" fill="none" stroke="#22c55e" stroke-width="3"></path><text class="tiny" x="468" y="34" fill="#64748b" font-size="16" font-weight="700">bound</text>
<path class="line" d="M700 75 H780" marker-end="url(#arrowPv)" fill="none" stroke="#64748b" stroke-width="3"></path><text class="tiny" x="706" y="34" fill="#64748b" font-size="16" font-weight="700">mounts</text>
<text class="title" x="20" y="190" fill="#111827" font-size="28" font-weight="900">When the PVC is deleted…</text>
<rect class="repel" height="70" rx="16" width="200" x="20" y="210" fill="#fef0d4" stroke="#eeb85b" stroke-width="2"></rect><text class="tiny" x="40" y="240" fill="#64748b" font-size="16" font-weight="700">PVC deleted</text><text class="tiny" x="40" y="262" fill="#64748b" font-size="16" font-weight="700">PV → Released</text>
<rect class="attract" height="70" rx="16" width="260" x="320" y="180" fill="#dcfce7" stroke="#6edb8d" stroke-width="2"></rect><text class="label" x="346" y="216" fill="#111827" font-size="20" font-weight="800">Retain</text><text class="tiny" x="346" y="240" fill="#64748b" font-size="16" font-weight="700">PV + data kept for manual recovery</text>
<rect class="repel" height="70" rx="16" width="260" x="320" y="270" fill="#fef0d4" stroke="#eeb85b" stroke-width="2"></rect><text class="label" x="346" y="306" fill="#111827" font-size="20" font-weight="800">Delete</text><text class="tiny" x="346" y="330" fill="#64748b" font-size="16" font-weight="700">PV and backing volume destroyed</text>
<path class="ok-line" d="M220 235 C270 220 280 215 320 213" marker-end="url(#arrowPv)" fill="none" stroke="#22c55e" stroke-width="3"></path>
<path class="bad-line" d="M220 250 C270 270 280 290 320 300" marker-end="url(#arrowPv)" fill="none" stroke="#f59e0b" stroke-width="3"></path>
<text class="tiny" x="640" y="220" fill="#64748b" font-size="16" font-weight="700">choose Retain for valuable data;</text>
<text class="tiny" x="640" y="244" fill="#64748b" font-size="16" font-weight="700">dynamic volumes often default to Delete</text>
</svg>
