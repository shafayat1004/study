<svg xmlns="http://www.w3.org/2000/svg" aria-label="Affinity attraction versus taint repulsion" class="diagram" role="img" viewBox="0 0 1120 320">
<defs>
<marker id="arrowOk" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="ok-arrow" d="M0,0 L0,6 L9,3 z" fill="#22c55e"></path></marker>
<marker id="arrowBad" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="bad-arrow" d="M0,0 L0,6 L9,3 z" fill="#f59e0b"></path></marker>
</defs>
<text class="title" x="20" y="40" fill="#111827" font-size="28" font-weight="900">Affinity attracts</text>
<rect class="pod" height="60" rx="14" width="170" x="60" y="70" fill="#dcfce7" stroke="#6edb8d" stroke-width="2"></rect><text class="tiny" x="80" y="98" fill="#64748b" font-size="16" font-weight="700">Pod wants</text><text class="tiny" x="80" y="118" fill="#64748b" font-size="16" font-weight="700">disktype=ssd</text>
<rect class="attract" height="96" rx="16" width="220" x="60" y="190" fill="#dcfce7" stroke="#6edb8d" stroke-width="2"></rect><text class="label" x="90" y="234" fill="#111827" font-size="20" font-weight="800">node</text><text class="tiny" x="90" y="258" fill="#64748b" font-size="16" font-weight="700">labelled ssd</text>
<path class="ok-line" d="M145 130 V190" marker-end="url(#arrowOk)" fill="none" stroke="#22c55e" stroke-width="3"></path>
<text class="tiny" x="60" y="306" fill="#64748b" font-size="16" font-weight="700">nodeSelector / nodeAffinity pulls it in</text>
<line class="divider" x1="540" x2="540" y1="30" y2="300" stroke="#d9e2ef" stroke-width="2"></line>
<text class="title" x="600" y="40" fill="#111827" font-size="28" font-weight="900">Taints repel</text>
<rect class="pod" height="60" rx="14" width="160" x="600" y="70" fill="#dcfce7" stroke="#6edb8d" stroke-width="2"></rect><text class="tiny" x="618" y="98" fill="#64748b" font-size="16" font-weight="700">Pod, no</text><text class="tiny" x="618" y="118" fill="#64748b" font-size="16" font-weight="700">toleration</text>
<rect class="pod" height="60" rx="14" width="170" x="900" y="70" fill="#dcfce7" stroke="#6edb8d" stroke-width="2"></rect><text class="tiny" x="918" y="98" fill="#64748b" font-size="16" font-weight="700">Pod with</text><text class="tiny" x="918" y="118" fill="#64748b" font-size="16" font-weight="700">toleration</text>
<rect class="repel" height="96" rx="16" width="280" x="640" y="190" fill="#fef0d4" stroke="#eeb85b" stroke-width="2"></rect><text class="label" x="668" y="230" fill="#111827" font-size="20" font-weight="800">node</text><text class="tiny" x="668" y="254" fill="#64748b" font-size="16" font-weight="700">taint: gpu=true:NoSchedule</text>
<path class="bad-line dashed" d="M680 130 V190" marker-end="url(#arrowBad)" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8"></path>
<text class="bad-arrow" font-size="34" font-weight="900" x="700" y="172" fill="#f59e0b">✕</text>
<path class="ok-line" d="M985 130 C940 158 900 168 860 190" marker-end="url(#arrowOk)" fill="none" stroke="#22c55e" stroke-width="3"></path>
</svg>
