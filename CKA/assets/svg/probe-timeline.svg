<svg xmlns="http://www.w3.org/2000/svg" aria-label="Container probe timeline" class="diagram" role="img" viewBox="0 0 1120 280">
<defs><marker id="arrowProbe" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="arrow" d="M0,0 L0,6 L9,3 z" fill="#64748b"></path></marker></defs>
<text class="title" x="20" y="40" fill="#111827" font-size="28" font-weight="900">Probe timeline</text>
<line class="line" x1="80" x2="1080" y1="64" y2="64" fill="none" stroke="#64748b" stroke-width="3"></line>
<circle class="arrow" cx="80" cy="64" r="8" fill="#64748b"></circle>
<text class="tiny" x="58" y="48" fill="#64748b" font-size="16" font-weight="700">container starts</text>
<rect class="ctrl" height="54" rx="12" width="320" x="120" y="92" fill="#ede9fe" stroke="#b69bf2" stroke-width="2"></rect><text class="label" x="142" y="118" fill="#111827" font-size="20" font-weight="800">startup probe</text><text class="tiny" x="142" y="138" fill="#64748b" font-size="16" font-weight="700">guards slow boot</text>
<text class="tiny" x="120" y="168" fill="#64748b" font-size="16" font-weight="700">liveness + readiness held until this passes</text>
<rect class="repel" height="54" rx="12" width="600" x="470" y="92" fill="#fef0d4" stroke="#eeb85b" stroke-width="2"></rect><text class="label" x="492" y="118" fill="#111827" font-size="20" font-weight="800">liveness probe</text><text class="tiny" x="690" y="124" fill="#64748b" font-size="16" font-weight="700">fails → restart container</text>
<rect class="attract" height="54" rx="12" width="600" x="470" y="180" fill="#dcfce7" stroke="#6edb8d" stroke-width="2"></rect><text class="label" x="492" y="206" fill="#111827" font-size="20" font-weight="800">readiness probe</text><text class="tiny" x="690" y="212" fill="#64748b" font-size="16" font-weight="700">fails → drop from Service endpoints</text>
<path class="line" d="M440 119 H470" marker-end="url(#arrowProbe)" fill="none" stroke="#64748b" stroke-width="3"></path>
<text class="tiny" x="980" y="262" fill="#64748b" font-size="16" font-weight="700">time →</text>
</svg>
