<svg xmlns="http://www.w3.org/2000/svg" aria-label="Kubernetes cluster architecture diagram" class="diagram" role="img" viewBox="0 0 1120 620">
<style><![CDATA[
.box { fill: color-mix(in srgb, var(--accent, #326ce5) 7%, transparent); stroke: var(--line, #d9e2ef); stroke-width: 2; }
.worker { fill: color-mix(in srgb, var(--accent-2, #14b8a6) 7%, transparent); }
.node { fill: var(--paper-solid, #ffffff); stroke: color-mix(in srgb, var(--accent, #326ce5) 45%, var(--line, #d9e2ef)); stroke-width: 2; }
.api { fill: color-mix(in srgb, var(--accent, #326ce5) 16%, var(--paper-solid, #ffffff)); }
.etcd { fill: color-mix(in srgb, var(--warn, #f59e0b) 18%, var(--paper-solid, #ffffff)); }
.pod { fill: color-mix(in srgb, var(--good, #22c55e) 16%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--good, #22c55e) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.line { fill: none; stroke: var(--muted, #64748b); stroke-width: 3; }
.dashed { stroke-dasharray: 8 8; }
.arrow { fill: var(--muted, #64748b); }
.title { fill: var(--ink, #111827); font-size: 28px; font-weight: 900; }
.label { fill: var(--ink, #111827); font-size: 20px; font-weight: 800; }
.tiny { fill: var(--muted, #64748b); font-size: 16px; font-weight: 700; }
.attract { fill: color-mix(in srgb, var(--good, #22c55e) 16%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--good, #22c55e) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.repel { fill: color-mix(in srgb, var(--warn, #f59e0b) 18%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--warn, #f59e0b) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.ctrl { fill: color-mix(in srgb, var(--accent-3, #8b5cf6) 15%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--accent-3, #8b5cf6) 50%, var(--line, #d9e2ef)); stroke-width: 2; }
.ok-line { fill: none; stroke: var(--good, #22c55e); stroke-width: 3; }
.bad-line { fill: none; stroke: var(--warn, #f59e0b); stroke-width: 3; }
.ok-arrow { fill: var(--good, #22c55e); }
.bad-arrow { fill: var(--warn, #f59e0b); }
.gate { fill: color-mix(in srgb, var(--accent, #326ce5) 12%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--accent, #326ce5) 45%, var(--line, #d9e2ef)); stroke-width: 2; }
.divider { stroke: var(--line, #d9e2ef); stroke-width: 2; }
]]></style>
<defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="arrow" d="M0,0 L0,6 L9,3 z"></path></marker></defs>
<rect class="box plane" height="470" rx="28" width="480" x="40" y="70"></rect><text class="title" x="70" y="112">Control plane</text>
<rect class="node api" height="76" rx="16" width="180" x="80" y="150"></rect><text class="label" x="103" y="195">kube-apiserver</text>
<rect class="node etcd" height="76" rx="16" width="160" x="300" y="150"></rect><text class="label" x="355" y="195">etcd</text>
<rect class="node" height="76" rx="16" width="180" x="80" y="270"></rect><text class="label" x="114" y="315">scheduler</text>
<rect class="node" height="76" rx="16" width="160" x="300" y="270"></rect><text class="label" x="321" y="315">controllers</text>
<rect class="node" height="72" rx="16" width="280" x="130" y="400"></rect><text class="label" x="171" y="443">cloud-controller-manager</text>
<rect class="box worker" height="470" rx="28" width="470" x="610" y="70"></rect><text class="title" x="640" y="112">Worker node</text>
<rect class="node" height="72" rx="16" width="170" x="650" y="150"></rect><text class="label" x="704" y="193">kubelet</text>
<rect class="node" height="72" rx="16" width="170" x="870" y="150"></rect><text class="label" x="900" y="193">kube-proxy</text>
<rect class="node" height="72" rx="16" width="170" x="650" y="270"></rect><text class="label" x="680" y="313">container runtime</text>
<rect class="node" height="72" rx="16" width="170" x="870" y="270"></rect><text class="label" x="916" y="313">CNI plugin</text>
<rect class="pod" height="72" rx="16" width="290" x="700" y="400"></rect><text class="label" x="756" y="443">Pods and workloads</text>
<path class="line" d="M260 188 H300" marker-end="url(#arrow)"></path><path class="line" d="M460 188 C560 178 560 178 650 186" marker-end="url(#arrow)"></path>
<path class="line" d="M260 310 C420 305 510 260 650 186" marker-end="url(#arrow)"></path><path class="line" d="M735 222 V270" marker-end="url(#arrow)"></path>
<path class="line" d="M735 342 V400" marker-end="url(#arrow)"></path><path class="line" d="M955 342 C955 365 945 385 910 400" marker-end="url(#arrow)"></path>
<text class="tiny" x="515" y="178">API-driven reconciliation</text>
</svg>
