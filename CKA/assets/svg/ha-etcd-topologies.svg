<svg xmlns="http://www.w3.org/2000/svg" aria-label="Stacked etcd versus external etcd HA topologies" class="diagram" role="img" viewBox="0 0 1120 430">
<style><![CDATA[
.box { fill: color-mix(in srgb, var(--accent, #326ce5) 7%, transparent); stroke: var(--line, #d9e2ef); stroke-width: 2; }
.worker { fill: color-mix(in srgb, var(--accent-2, #14b8a6) 7%, transparent); }
.node { fill: var(--paper-solid, #ffffff); stroke: color-mix(in srgb, var(--accent, #326ce5) 45%, var(--line, #d9e2ef)); stroke-width: 2; }
.api { fill: color-mix(in srgb, var(--accent, #326ce5) 16%, var(--paper-solid, #ffffff)); }
.etcd { fill: color-mix(in srgb, var(--warn, #f59e0b) 18%, var(--paper-solid, #ffffff)); }
.pod { fill: color-mix(in srgb, var(--good, #22c55e) 16%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--good, #22c55e) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.line { fill: none; stroke: var(--muted, #64748b); stroke-width: 3; }
.dashed { stroke-dasharray: 8 8; }
.arrow { fill: var(--muted, #64748b); }
.title { fill: var(--ink, #111827); font-size: 28px; font-weight: 900; }
.label { fill: var(--ink, #111827); font-size: 20px; font-weight: 800; }
.tiny { fill: var(--muted, #64748b); font-size: 16px; font-weight: 700; }
.attract { fill: color-mix(in srgb, var(--good, #22c55e) 16%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--good, #22c55e) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.repel { fill: color-mix(in srgb, var(--warn, #f59e0b) 18%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--warn, #f59e0b) 55%, var(--line, #d9e2ef)); stroke-width: 2; }
.ctrl { fill: color-mix(in srgb, var(--accent-3, #8b5cf6) 15%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--accent-3, #8b5cf6) 50%, var(--line, #d9e2ef)); stroke-width: 2; }
.ok-line { fill: none; stroke: var(--good, #22c55e); stroke-width: 3; }
.bad-line { fill: none; stroke: var(--warn, #f59e0b); stroke-width: 3; }
.ok-arrow { fill: var(--good, #22c55e); }
.bad-arrow { fill: var(--warn, #f59e0b); }
.gate { fill: color-mix(in srgb, var(--accent, #326ce5) 12%, var(--paper-solid, #ffffff)); stroke: color-mix(in srgb, var(--accent, #326ce5) 45%, var(--line, #d9e2ef)); stroke-width: 2; }
.divider { stroke: var(--line, #d9e2ef); stroke-width: 2; }
]]></style>
<defs><marker id="arrowHA" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="arrow" d="M0,0 L0,6 L9,3 z"></path></marker></defs>
<text class="title" x="40" y="40">Stacked etcd</text>
<rect class="gate" height="52" rx="14" width="220" x="120" y="64"></rect><text class="label" x="150" y="97">Load balancer</text>
<rect class="node" height="118" rx="16" width="200" x="40" y="160"></rect><text class="tiny" x="58" y="184">control-plane 1</text>
<rect class="node api" height="40" rx="10" width="164" x="58" y="196"></rect><text class="tiny" x="78" y="221">apiserver</text>
<rect class="node etcd" height="40" rx="10" width="164" x="58" y="240"></rect><text class="tiny" x="98" y="265">etcd</text>
<rect class="node" height="118" rx="16" width="200" x="270" y="160"></rect><text class="tiny" x="288" y="184">control-plane 2</text>
<rect class="node api" height="40" rx="10" width="164" x="288" y="196"></rect><text class="tiny" x="308" y="221">apiserver</text>
<rect class="node etcd" height="40" rx="10" width="164" x="288" y="240"></rect><text class="tiny" x="328" y="265">etcd</text>
<path class="line" d="M200 116 C160 140 150 150 140 160" marker-end="url(#arrowHA)"></path>
<path class="line" d="M250 116 C300 140 350 150 370 160" marker-end="url(#arrowHA)"></path>
<text class="tiny" x="40" y="320">etcd member lives on every control-plane node</text>
<line class="divider" x1="560" x2="560" y1="40" y2="380"></line>
<text class="title" x="620" y="40">External etcd</text>
<rect class="gate" height="52" rx="14" width="220" x="700" y="64"></rect><text class="label" x="730" y="97">Load balancer</text>
<rect class="node api" height="70" rx="16" width="180" x="620" y="160"></rect><text class="label" x="648" y="201">apiserver 1</text>
<rect class="node api" height="70" rx="16" width="180" x="840" y="160"></rect><text class="label" x="868" y="201">apiserver 2</text>
<rect class="box" height="96" rx="16" width="360" x="640" y="270"></rect><text class="tiny" x="658" y="294">dedicated etcd cluster</text>
<rect class="node etcd" height="38" rx="10" width="100" x="658" y="306"></rect><text class="tiny" x="690" y="330">etcd</text>
<rect class="node etcd" height="38" rx="10" width="100" x="770" y="306"></rect><text class="tiny" x="802" y="330">etcd</text>
<rect class="node etcd" height="38" rx="10" width="100" x="882" y="306"></rect><text class="tiny" x="914" y="330">etcd</text>
<path class="line" d="M790 116 C740 138 720 150 710 160" marker-end="url(#arrowHA)"></path>
<path class="line" d="M830 116 C880 138 920 150 930 160" marker-end="url(#arrowHA)"></path>
<path class="line dashed" d="M710 230 V270" marker-end="url(#arrowHA)"></path>
<path class="line dashed" d="M930 230 C900 248 850 258 820 270" marker-end="url(#arrowHA)"></path>
</svg>
