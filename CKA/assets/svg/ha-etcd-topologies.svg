<rect class="node etcd" height="40" rx="10" width="164" x="288" y="240" fill="#fef0d4" stroke="#9bb4ee" stroke-width="2"></rect><text class="tiny" x="328" y="265" fill="#64748b" font-size="16" font-weight="700">etcd</text>
