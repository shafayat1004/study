<svg xmlns="http://www.w3.org/2000/svg" aria-label="Stacked etcd versus external etcd HA topologies" class="diagram" role="img" viewBox="0 0 1120 430">
<defs><marker id="arrowHA" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path class="arrow" d="M0,0 L0,6 L9,3 z" fill="#64748b"></path></marker></defs>
<text class="title" x="40" y="40" fill="#111827" font-size="28" font-weight="900">Stacked etcd</text>
